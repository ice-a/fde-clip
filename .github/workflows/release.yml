name: release
permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=6144


on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            targets: "aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            targets: "x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            targets: ""
          - platform: windows-latest
            args: ""
            targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "fde-clip ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  build-android:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --install "ndk;28.2.13676358" "platforms;android-35"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Android APK and AAB
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_HOME="$NDK_HOME"
          pnpm install
          chmod +x src-tauri/gen/android/gradlew
          pnpm tauri android build --ci --apk --aab -t aarch64


      - name: Sign Android artifacts
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/fde-clip.jks" -alias fde-clip \
            -storepass androidrelease -keypass androidrelease -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=fde-clip" -noprompt
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          AAB=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' | head -1)
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/fde-clip.jks" \
            --ks-pass pass:androidrelease --key-pass pass:androidrelease \
            --out "$RUNNER_TEMP/fde-clip-arm64.apk" "$APK"
          "$APKSIGNER" verify "$RUNNER_TEMP/fde-clip-arm64.apk"
          jarsigner -keystore "$RUNNER_TEMP/fde-clip.jks" -storepass androidrelease \
            -keypass androidrelease "$AAB" fde-clip
      - name: Upload Android artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ runner.temp }}/fde-clip-arm64.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

# macOS 签名需在仓库 Secrets 配置 APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD /
# APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID。
