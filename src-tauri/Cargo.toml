[package]
name = "fde-clip"
version = "0.2.0"
license = "MIT"
description = "Smart clipboard workbench"
authors = ["fde-clip contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "fde_clip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["crates/*"]
resolver = "2"

[dependencies]
tauri = { version = "2.12.7", features = ["tray-icon"] }
regex = "1"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
anyhow = "1"

clipboard_watcher = { path = "crates/clipboard_watcher" }
sniffer = { path = "crates/sniffer" }
vault = { path = "crates/vault" }
chef_bridge = { path = "crates/chef_bridge" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
